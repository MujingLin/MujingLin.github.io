  <style>html,body{margin:0;background:#002d46}.page-open-hitarea{position:fixed;z-index:8;inset:0;width:100%;height:100%;padding:0;border:0;background:transparent}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">

</head>
<body class="landing landing-video" data-page="home">
  <div class="hero-scene" aria-hidden="true">
    <video class="hero-video" autoplay loop muted playsinline preload="auto" poster="/backgroundimage/home-cat-video-poster.jpg?v=20260730a">
      <source src="/backgroundimage/home-cat-video-mobile.mp4?v=20260730a" type="video/mp4" media="(max-width: 760px)">
      <source src="/backgroundimage/home-cat-video.mp4?v=20260730a" type="video/mp4">
    </video>
    <div class="hero-scene-depth"></div>
  </div>

  <main class="hero-copy">
    <h1 class="animate-fade-rise">Where stories bloom <em>between feeling and intelligence.</em></h1>
  </main>

  <button class="page-open-hitarea" type="button" data-open-terminal aria-label="Open Mujing Lin's terminal">
    <span class="sr-only">Open terminal</span>
  </button>

  <section class="terminal-overlay" id="terminal-overlay" aria-hidden="true">
    <button class="terminal-backdrop" type="button" data-close-terminal aria-label="Close terminal"></button>
    <div class="terminal-dialog" role="dialog" aria-modal="true" aria-labelledby="name">
      <section class="screen" id="landing-screen" aria-label="Launch portfolio" role="button" tabindex="0">
        <div class="code-macos">
          <div class="code-titlebar"><span class="code-dots"><button type="button" data-close-terminal aria-label="Close terminal"></button><i></i><i></i></span><span class="code-filename">mujing — zsh — 80×24</span><span class="code-titlebar-spacer"></span></div>
          <div class="code-body terminal-session">
            <div class="terminal-identity"><h1 id="name">MUJING LIN</h1><p>FILM · AI · STORYTELLING</p></div>
            <p class="typing-container terminal-typing"><span id="typingText" data-typing-en="I make films where human feeling and intelligent tools meet.|I explore new ways to tell stories with AI.|Welcome to my moving-image portfolio."></span><i class="typing-cursor" aria-hidden="true"></i></p>
            <div class="launch-block"><p class="terminal-output launch-state">READY TO EXPLORE?</p><p class="launch-enter">ENTER</p><div class="launch-progress"><span>[</span><i><b></b></i><span>]</span><strong id="launch-percent">0%</strong></div></div>
          </div>
        </div>
      </section>
    </div>
  </section>

  <div class="webgl-transition" id="webgl-transition"></div>
  <div class="tide-transition" id="tide-transition"></div>

  <script>
    (()=>{const body=document.body,overlay=document.querySelector("#terminal-overlay"),video=document.querySelector(".hero-video");document.querySelectorAll("[data-open-terminal]").forEach(button=>button.addEventListener("click",()=>{body.classList.add("terminal-open");overlay?.setAttribute("aria-hidden","false")}));if(video){const ready=()=>body.classList.add("video-ready");if(video.readyState>=2)ready();else video.addEventListener("loadeddata",ready,{once:true});video.addEventListener("error",()=>body.classList.add("video-unavailable"),{once:true})}})();
  </script>
  <script src="/assets/js/portfolio-data.js?v=20260730a"></script>
  <script src="/assets/js/portfolio.js?v=20260730b"></script>
  <script src="/assets/js/analytics.js?v=20260730a" defer></script>
  <script src="/assets/vendor/hover-effect/three.min.js" defer></script>
  <script src="/assets/vendor/hover-effect/gsap.min.js" defer></script>
  <script src="/assets/vendor/hover-effect/hover-effect.umd.js" defer></script>
</body>
</html>
